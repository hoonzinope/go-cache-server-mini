persistent:
  type: file # options: memory, file
  path: "./persistent_data/"

ttl:
  default: 86400  # default TTL in seconds (1 day)
  max: 604800     # maximum TTL in seconds (7 days)

http:
  enabled: true
  address: ":8080"

# Distributed caching configuration with docker swarm
distributed:
  enabled: false
  grpc_port: 50051
  swarm_service_name: "go-cache-service"
  update_interval: 10  # in seconds
  replication_factor: 3
  backup_nodes: 0